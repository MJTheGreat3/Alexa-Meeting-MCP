<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meeting Pipeline — Alexa+ simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b10;
    --bg-2: #11131c;
    --panel: #151826;
    --panel-2: #1b1f30;
    --text: #edeef5;
    --muted: #8990a8;
    --faint: #565d77;
    --accent: #6d8cff;
    --accent-2: #2fd99f;
    --accent-soft: rgba(109,140,255,0.12);
    --error: #ff6b7a;
    --border: #262a3d;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(109,140,255,0.16), transparent),
      radial-gradient(ellipse 700px 400px at 90% 10%, rgba(47,217,159,0.08), transparent),
      var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 72px;
    -webkit-font-smoothing: antialiased;
  }
  header { text-align: center; margin-bottom: 32px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--accent-2); background: rgba(47,217,159,0.1);
    border: 1px solid rgba(47,217,159,0.25); border-radius: 999px;
    padding: 4px 10px; margin-bottom: 14px;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 8px var(--accent-2); }
  h1 {
    font-size: 26px; margin: 0 0 8px; font-weight: 700; letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff, #aab4d6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { color: var(--muted); font-size: 13.5px; margin: 0; }

  .mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 28px; }
  .mic-btn {
    width: 88px; height: 88px; border-radius: 50%;
    background: linear-gradient(145deg, var(--accent), #4a65e0); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(109,140,255,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .mic-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(109,140,255,0.45), inset 0 1px 0 rgba(255,255,255,0.15); }
  .mic-btn:active { transform: translateY(0); }
  .mic-btn.listening { background: linear-gradient(145deg, var(--accent-2), #1fa87c); animation: pulse 1.4s infinite; }
  .mic-btn svg { width: 34px; height: 34px; fill: white; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(47,217,159,0.5), 0 8px 24px rgba(47,217,159,0.3); }
    70% { box-shadow: 0 0 0 20px rgba(47,217,159,0), 0 8px 24px rgba(47,217,159,0.3); }
    100% { box-shadow: 0 0 0 0 rgba(47,217,159,0), 0 8px 24px rgba(47,217,159,0.3); }
  }
  .mic-label { color: var(--muted); font-size: 12.5px; font-weight: 500; }

  .panel {
    width: 100%; max-width: 640px; background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 20px 40px -24px rgba(0,0,0,0.6);
  }
  textarea {
    width: 100%; min-height: 120px; resize: vertical;
    background: var(--bg-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 11px;
    padding: 13px 14px; font-size: 13.5px; font-family: inherit; line-height: 1.6;
    transition: border-color 0.15s ease;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea::placeholder { color: var(--faint); }
  .row { display: flex; gap: 10px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  button.action {
    background: var(--accent); color: white; border: none;
    padding: 10px 18px; border-radius: 9px; cursor: pointer; font-size: 13.5px; font-weight: 600;
    box-shadow: 0 2px 10px rgba(109,140,255,0.3);
    transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.15s ease;
  }
  button.action:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(109,140,255,0.4); }
  button.action:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  button.ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 9px; cursor: pointer; font-size: 13.5px; font-weight: 500;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  button.ghost:hover { border-color: var(--faint); color: var(--text); }
  .status { font-size: 12px; color: var(--muted); margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .spinner {
    width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.7s linear infinite; display: none;
  }
  .status.working .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .log { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 10px; }
  .turn {
    border-radius: 13px; padding: 13px 15px; font-size: 13.5px; line-height: 1.55;
    border: 1px solid var(--border); background: var(--panel);
    animation: rise 0.25s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .turn.user { background: var(--panel-2); border-color: #333a56; }
  .turn.tool_call { background: rgba(109,140,255,0.06); border-color: rgba(109,140,255,0.25); }
  .turn.tool_result { background: rgba(47,217,159,0.05); border-color: rgba(47,217,159,0.2); }
  .turn.tool_result.error { background: rgba(255,107,122,0.08); border-color: rgba(255,107,122,0.3); }
  .turn.final { background: rgba(47,217,159,0.1); border-color: rgba(47,217,159,0.35); font-weight: 500; }
  .turn .kicker {
    display: flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px;
  }
  .turn .kicker svg { width: 12px; height: 12px; opacity: 0.8; }
  .turn pre {
    margin: 8px 0 0; white-space: pre-wrap; word-break: break-word;
    font-size: 12px; color: var(--muted); font-family: "JetBrains Mono", ui-monospace, monospace;
    background: rgba(0,0,0,0.18); border-radius: 8px; padding: 9px 11px;
  }
  .turn a { color: var(--accent); text-decoration: none; }
  .turn a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .mic-btn { width: 76px; height: 76px; }
    h1 { font-size: 21px; }
  }
</style>
</head>
<body>
  <header>
    <div class="badge"><span class="dot"></span>Route B &middot; live demo</div>
    <h1>Meeting Pipeline</h1>
    <p>Simulated Alexa+ voice turn &middot; real MCP server &middot; real Linear / Notion / Slack calls</p>
  </header>

  <div class="mic-wrap">
    <button class="mic-btn" id="micBtn" title="Speak your meeting notes">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <div class="mic-label" id="micLabel">Tap to speak, or type below</div>
  </div>

  <div class="panel">
    <textarea id="transcript" placeholder="Paste or speak meeting notes...">Standup - Oct 6
Priya: Checkout page still throws a 500 when the cart is empty, need someone on that today.
Dev: I'll also write up the API rate-limit doc so support stops getting paged for it.
Priya: And can someone ping the team once both are filed so folks know to stop retrying?</textarea>
    <div class="row">
      <button class="action" id="sendBtn">Send to agent</button>
      <button class="ghost" id="clearBtn">Clear log</button>
      <span class="status" id="status"><span class="spinner"></span><span id="statusText"></span></span>
    </div>
  </div>

  <div class="log" id="log"></div>

<script>
  const micBtn = document.getElementById('micBtn');
  const micLabel = document.getElementById('micLabel');
  const transcriptEl = document.getElementById('transcript');
  const sendBtn = document.getElementById('sendBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusEl = document.getElementById('status');
  const statusTextEl = document.getElementById('statusText');
  const logEl = document.getElementById('log');

  function setStatus(text, working) {
    statusTextEl.textContent = text;
    statusEl.classList.toggle('working', Boolean(working));
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizing = false;
  if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    micBtn.addEventListener('click', async () => {
      if (recognizing) { recognition.stop(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach((t) => t.stop());
      } catch (err) {
        micLabel.textContent = 'Mic permission denied, check browser/site settings';
        console.error('getUserMedia failed:', err);
        return;
      }
      try {
        recognition.start();
      } catch (err) {
        console.error('recognition.start() failed:', err);
      }
    });
    recognition.onstart = () => {
      recognizing = true;
      micBtn.classList.add('listening');
      micLabel.textContent = 'Listening...';
    };
    recognition.onend = () => {
      recognizing = false;
      micBtn.classList.remove('listening');
      if (micLabel.textContent === 'Listening...') {
        micLabel.textContent = 'Tap to speak, or type below';
      }
    };
    recognition.onresult = (event) => {
      const said = event.results[0][0].transcript;
      transcriptEl.value = (transcriptEl.value ? transcriptEl.value + '\n' : '') + said;
    };
    recognition.onerror = (event) => {
      recognizing = false;
      micBtn.classList.remove('listening');
      console.error('SpeechRecognition error:', event.error);
      const messages = {
        'not-allowed': 'Mic permission denied, check browser/site settings',
        'service-not-allowed': 'Speech service blocked, check browser/site settings',
        'no-speech': 'Did not hear anything, try again',
        'audio-capture': 'No microphone found',
        network: 'Network error reaching speech service',
      };
      micLabel.textContent = messages[event.error] || ('Mic error: ' + event.error + ', try typing');
    };
  } else {
    micLabel.textContent = 'Voice input not supported in this browser, type below';
    micBtn.disabled = true;
    micBtn.style.opacity = 0.4;
  }

  const ICONS = {
    user: '<svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z"/></svg>',
    tool_call: '<svg viewBox="0 0 24 24"><path d="M12 2l1.8 4.2L18 8l-4.2 1.8L12 14l-1.8-4.2L6 8l4.2-1.8L12 2zM5 15l.9 2.1L8 18l-2.1.9L5 21l-.9-2.1L2 18l2.1-.9L5 15zm14 0l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/></svg>',
    tool_result: '<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>',
    final: '<svg viewBox="0 0 24 24"><path d="M12 2l2.2 6.8H21l-5.6 4.1 2.1 6.8L12 15.6l-5.5 4.1 2.1-6.8L3 8.8h6.8z"/></svg>',
  };

  function addTurn(cls, kicker, bodyHtml) {
    const iconKey = cls.split(' ')[0];
    const div = document.createElement('div');
    div.className = 'turn ' + cls;
    div.innerHTML = '<div class="kicker">' + (ICONS[iconKey] || '') + kicker + '</div>' + bodyHtml;
    logEl.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  function linkify(text) {
    return text.replace(/https?:\/\/\S+/g, (url) => '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>');
  }

  function renderResult(result) {
    const str = typeof result === 'string' ? result : JSON.stringify(result, null, 2);
    return '<pre>' + linkify(str.replace(/</g, '&lt;')) + '</pre>';
  }

  function speak(text) {
    if (!window.speechSynthesis) return;
    const utter = new SpeechSynthesisUtterance(text);
    window.speechSynthesis.speak(utter);
  }

  async function send() {
    const transcript = transcriptEl.value.trim();
    if (!transcript) return;
    sendBtn.disabled = true;
    setStatus('Agent is working...', true);
    addTurn('user', 'You said', '<div>' + transcript.replace(/</g, '&lt;').replace(/\n/g, '<br>') + '</div>');

    try {
      const res = await fetch('/api/voice-turn', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transcript }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');

      for (const turn of data.turns) {
        if (turn.type === 'tool_call') {
          addTurn('tool_call', 'Calling ' + turn.tool, renderResult(turn.args));
        } else if (turn.type === 'tool_result') {
          addTurn('tool_result' + (turn.isError ? ' error' : ''), turn.tool + ' result', renderResult(turn.result));
        } else if (turn.type === 'final') {
          addTurn('final', 'Alexa+', '<div>' + turn.text.replace(/</g, '&lt;') + '</div>');
          speak(turn.text);
        }
      }
      setStatus('Done', false);
    } catch (err) {
      addTurn('tool_result error', 'Error', '<div>' + String(err.message || err).replace(/</g, '&lt;') + '</div>');
      setStatus('Failed', false);
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', send);
  clearBtn.addEventListener('click', () => { logEl.innerHTML = ''; setStatus('', false); });
</script>
</body>
</html>
